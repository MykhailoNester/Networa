name: CI

on:
  push:
    # develop is the integration branch — feature/* work lands there first, so it
    # needs the same gate as main. Feature branches themselves are covered by
    # the pull_request trigger below.
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the quality gate
        run: make check-all
